<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anahata Open Source Central Assets</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #50c878, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #a0aec0;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .barca-salute {
            color: #ff3e3e;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #50c878, #3b82f6);
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.anahata.uno/assets/logo-transparent.png" alt="Anahata Logo" class="logo">
        <h1>Anahata OS Central Assets</h1>
        <p>This subdomain hosts the central resources, documentation, and the legendary Barça-themed Javadoc styles for all open-source Anahata projects.</p>
        <p class="barca-salute">Força Barça! 🔵🔴 Messi is and will always be the Greatest of All Timelines.</p>
        <a href="https://github.com/sponsors/anahata-os" target="_blank" class="btn">Support Our Open Source Ecosystem ❤️</a>
    </div>
</body>
</html>
